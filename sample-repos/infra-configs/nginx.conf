# Edge load balancer for api.acme-corp.internal
# Last touched 2019 — "if it ain't broke" (it is broke: quantum-harvestable)

upstream api_backend {
    server 10.0.4.11:8443;
    server 10.0.4.12:8443;
}

server {
    listen 443 ssl;
    server_name api.acme-corp.com;

    ssl_certificate     /etc/nginx/certs/api.crt;
    ssl_certificate_key /etc/nginx/certs/api.key;

    # Legacy clients (an old kiosk fleet) forced us to keep TLSv1 enabled.
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;

    # RSA key exchange has no forward secrecy: every recorded session can be
    # decrypted later by anyone who obtains (or factors) the RSA key.
    ssl_ciphers ECDHE-RSA-AES256-GCM-SHA384:AES128-SHA:RSA+AES:!aNULL:!MD5;

    location / {
        proxy_pass https://api_backend;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
